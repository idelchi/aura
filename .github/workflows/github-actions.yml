name: aura

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  build-platforms:
    name: Build and persistence tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      CGO_ENABLED: "1"
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify the native C toolchain
        run: |
          gcc --version
          g++ --version
      - name: Build all application packages
        run: go build ./...
      - name: Exercise file publication and its consumers
        run: go test ./internal/atomicfile ./internal/session ./internal/serve ./pkg/providers/script

  info:
    uses: idelchi/devenv/.github/workflows/info.yml@main

  lint:
    uses: idelchi/devenv/.github/workflows/task.yml@main
    needs: info

  test:
    needs: lint
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          check-latest: true

      - name: Test the application
        run: go test ./...
