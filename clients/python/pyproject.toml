[project]
name = "aura-automation"
version = "0.0.0"
description = "Client for Aura's automation contract: `aura session` store operations and the `aura serve` /v1 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<0.29",
    "httpx-sse>=0.4,<0.5",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
