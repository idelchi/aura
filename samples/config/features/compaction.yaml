compaction:
  timeout: 0s # total compaction/recovery budget; 0 adds no deadline beyond the caller
  threshold: 80
  trim_threshold: 50
  keep_last_messages: 10
  chunks: 5
  agent: ''
  tool_result_max_length: 65536
  truncation_retries:
    - 16384
    - 4096
    - 1024
    - 0
  prune:
    mode: "compaction"
  prompt: Compaction
