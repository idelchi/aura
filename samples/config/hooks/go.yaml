go:format:
  description: Format Go files with golangci-lint after edits
  event: post
  matcher: "Patch|Write|Edit"
  files: "*.go"
  silent: false
  command: |
    jq -r '.file_paths[] | select(endswith(".go"))' |
    while IFS= read -r file; do
      [ -f "${file}" ] || continue
      golangci-lint fmt --diff "${file}"
      golangci-lint fmt "${file}" || exit
    done
  timeout: 15

go:fix:
  description: Apply available gopls fixes and organize imports after formatting
  inherit: [go:format]
  depends: [go:format]
  silent: false
  command: |
    jq -r '.file_paths[] | select(endswith(".go"))' |
    while IFS= read -r file; do
      [ -f "${file}" ] || continue
      for kind in source.fixAll source.organizeImports; do
        while true; do
          actions=$(gopls codeaction -kind="${kind}" "${file}") || exit
          [ -n "${actions}" ] || break
          gopls codeaction -kind="${kind}" -exec -write -diff "${file}" || exit
        done
      done
    done
  timeout: 30

go:lint:
  description: Lint Go files with golangci-lint after fixes
  inherit: [go:format]
  depends: [go:fix]
  silent: false
  command: |
    go_packages=$(jq -r '.file_paths[] | select(endswith(".go"))' |
      while IFS= read -r file; do
        [ -f "${file}" ] || continue
        dirname "${file}"
      done | sort -u)
    [ -n "${go_packages}" ] || exit 0
    printf '%s\n' "${go_packages}" | while IFS= read -r package; do
      golangci-lint run "${package}" || exit
    done
